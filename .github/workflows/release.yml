name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/qqbox* dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/qqboxd* dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: qqbox-${{ matrix.target }}
          path: dist/
