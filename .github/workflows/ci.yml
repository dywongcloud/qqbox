name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      - name: check
        run: cargo check --workspace
      - name: tests
        run: cargo test --workspace
      - name: live witnesses
        shell: bash
        run: make witness
      - name: socket-level authz witness
        shell: bash
        run: make witness-http
      - name: invariants
        run: cargo run -q -p qqbox-cli -- invariants

  docs:
    name: zh-Hant gate and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: zh-Hant verify
        run: make zh-hant-verify

  zig-stubs:
    name: stub scripts and blobs are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: syntax check
        run: |
          sh -n stub/build.sh
          sh -n stub/macos/build.sh
          sh -n stub/macos/build-hvf.sh
          sh -n stub/windows/build.sh
          sh -n examples/qqbox/fetch-extras.sh
          sh -n examples/qqbox/fetch-chromium.sh
          sh -n examples/qqbox/chromium-wrapper.sh
          bash -n examples/qqbox/start-xubuntu.sh
          bash -n examples/xfce/start-xfce.sh
          bash -n examples/xubuntu/start-xubuntu.sh
      - name: committed stub integrity
        run: make stub-verify
      - name: pinned toolchain gate fails closed
        run: |
          if ZIG=/bin/false sh stub/build.sh >/dev/null 2>&1; then
            echo 'qqbox: stub/build.sh accepted a broken toolchain' >&2; exit 1
          fi
          echo 'stub_toolchain_gate_fails_closed=true'
      - name: Traditional Chinese gate
        run: make zh-hant-verify
      - name: flag provenance gate
        run: make flag-provenance-verify
      - name: pinned Zig 0.13.0 rebuild-and-compare
        run: |
          curl -fsSL -o /tmp/zig013.tar.xz \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          mkdir -p /tmp/zig013
          tar -xf /tmp/zig013.tar.xz -C /tmp/zig013 --strip-components=1
          ZIG=/tmp/zig013/zig make stub-rebuild-verify
