name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      - name: check
        run: cargo check --workspace
      - name: live witnesses
        shell: bash
        run: make witness
      - name: invariants
        run: cargo run -q -p laboon-cli -- invariants

  fmt:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings

  zig-stubs:
    name: stub scripts are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: syntax check
        run: |
          sh -n stub/build.sh
          sh -n stub/macos/build.sh
          sh -n stub/macos/build-hvf.sh
          sh -n stub/windows/build.sh
