[workspace]
resolver = "2"
members = ["crates/qqbox", "crates/qqbox-cli", "crates/qqboxd", "crates/qqbox-mcp", "crates/qqbox-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ureq = "2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tiny_http = "0.12"
