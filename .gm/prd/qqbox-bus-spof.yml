subject: Supervise the persistent session bus as a group
description: 'The event-driven supervisor owns dbus-daemon --session --fork but does not supervise the bus itself; kill -9 of the bus leaves Xvfb/x11vnc alive but all XFCE clients exit with Name org.xfce.Panel lost. Replace six independent loops with one bus-owning group supervisor: FIFO read blocks on bus address, wait -n -p blocks on first child exit; on bus exit kill/wait the group then restart with a fresh bus. No sleep/timeout/periodic recheck as correctness.'
