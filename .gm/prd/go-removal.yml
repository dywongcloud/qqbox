id: go-removal
subject: End-to-end removal of the Go portions
body: 'Delete the Go module tree, Go workspace and Go-specific build tooling once the Rust surface covers them; retain only Zig stubs, testdata binaries and fixtures needed by the Rust implementation; no Go source remains in the repository. BLOCKER (open, not resolved): the Linux memfd/seccomp/SIGSYS trap-to-supervisor backend IS ported to Rust and live-witnessed (backend witness match_ok=true; a real unmodified static aarch64 ELF exits 42 under the Rust supervisor; 80/80 chaos runs). macOS Mach/Seatbelt/HVF and Windows LPAC are NOT ported; PIE/ET_DYN, trampoline islands, the PROT_R hop alias and the full ~205-syscall table remain unported. The general qqbox run path still returns Error::UnsupportedPlatform after preparing the control plane. Decision and plan are in docs/PORT_STATUS.md and docs/NATIVE_BACKEND.md. Row stays pending until all three backends pass the historical regression corpus on each host. Superseding corrections are appended (append-only) in .gm/prd-log.jsonl: backend-boundary-correction-2026-11-20 and migration-boundary-and-correction-schema-2026-11-20.'
acceptance_criteria: A live witness shows no .go files remain and the Rust workspace still builds
